buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.squareup.wire:wire-gradle-plugin:6.4.5'
    }
}

plugins {
    id 'com.android.library'
}

// Generates the RetroStore API messages from src/main/proto. Applied the
// classpath way rather than through the plugins block so it resolves from
// Maven Central instead of the Gradle plugin portal.
apply plugin: 'com.squareup.wire'

// Pins the JDK that compiles, independently of the JDK that launches Gradle.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

wire {
    sourcePath {
        srcDir 'src/main/proto'
    }
    // Generates Kotlin data holders plus their ProtoAdapters. The package comes
    // from the proto's java_package option, so the generated types keep landing
    // in org.retrostore.client.common.proto.
    kotlin {}
}

android {
    compileSdk 37
    compileSdkMinor 1
    // Without this the build defaults to source/target 8, which JDK 21 has
    // deprecated and will eventually refuse to compile.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        minSdk 26
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'org.retrostore.android'
}

dependencies {
    repositories {
        google()
        mavenCentral()
    }
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    // api, not implementation: the generated messages are part of this module's
    // public surface, so their Message supertype and okio.ByteString have to be
    // on the consuming module's compile classpath too.
    api 'com.squareup.wire:wire-runtime:6.4.5'
    implementation 'io.ktor:ktor-client-okhttp:3.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
}
