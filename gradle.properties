# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 1536m was enough until the shared framework gained Compose and Navigation 3;
# linking the release iOS framework then ran out of heap. Kotlin/Native links
# the whole framework in one go, so this scales with what the shared module
# pulls in rather than with how much of it we wrote.
org.gradle.jvmargs=-Xmx6g
kotlin.daemon.jvmargs=-Xmx4g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

android.useAndroidX=true

# The shared iosMain source set calls the emulator core through cinterop. Its
# metadata compilation is shared across the three iOS targets, so without
# commonization the cinterop bindings are only visible to the per-target
# compilations and iosMain fails to resolve them.
kotlin.mpp.enableCInteropCommonization=true
# The app's version, for every place that shows one.
#
# Android's manifest, and the constants the shared code reads so that iOS says
# the same thing -- it has no manifest of its own to read, and was quietly
# showing whatever its bundle happened to carry. An iOS app target, when there
# is one, gets its Info.plist from here too.
#
# versionCode is Play's ordering, and it only ever goes up.
trs80VersionName=0.99.2
trs80VersionCode=51
