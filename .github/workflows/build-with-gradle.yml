# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build

on:
  push:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew build

  # Kotlin/Native cannot cross-compile to iOS, so the shared module's iOS
  # targets need a macOS runner. This exists to catch code that builds fine on
  # Android but not for iOS - JVM-only constructs such as @JvmStatic and
  # @JvmField are the common case, and they fail nowhere else.
  ios:
    name: shared module for iOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    # The Kotlin/Native toolchain is a large download and is not covered by the
    # Gradle cache.
    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/build.gradle') }}
        restore-keys: konan-${{ runner.os }}-
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    # Linking a framework proves the artifact an Xcode project would consume,
    # and pulls in the C emulator core: the linker is what catches a missing
    # platform implementation of trs80_audio.h.
    - name: Compile and link the shared module for iOS
      run: >-
        ./gradlew
        :shared:compileKotlinIosArm64
        :shared:linkDebugFrameworkIosArm64
        :shared:linkDebugFrameworkIosSimulatorArm64
    # The only step that actually runs the emulator core on iOS. Covers the
    # CMake build, cinterop, linking and execution in one go, so it is the step
    # that would catch the core breaking on iOS rather than merely failing to
    # compile.
    - name: Run the shared module's tests on the iOS simulator
      run: ./gradlew :shared:iosSimulatorArm64Test
