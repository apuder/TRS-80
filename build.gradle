// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 9.1.0 is the newest AGP Kotlin 2.4.x supports, so it stays until
        // Kotlin's window moves, not until AGP releases.
        classpath 'com.android.tools.build:gradle:9.1.0'
        // AGP 9 has a runtime dependency on KGP 2.2.10 and uses it for the app
        // module, but putting a newer KGP on this classpath
        // overrides that for the whole build -- which is what keeps every module
        // on one Kotlin, and what lets :shared depend on libraries built with
        // anything up to 2.4.x.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
        // Compose Multiplatform, for the shared UI. The compiler plugin ships
        // with Kotlin, so its version tracks Kotlin's rather than Compose's.
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10'
        classpath 'org.jetbrains.compose:compose-gradle-plugin:1.11.1'
        // Navigation 3 needs its destinations serializable, so it can put the
        // back stack away and get it back.
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.4.10'
        classpath 'com.google.gms:google-services:4.3.15'
        

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Deleting the root build directory, without claiming the name `clean`.
//
// It used to be `task clean(type: Delete)`, which is what every Android project
// was given in 2015. The Kotlin browser target applies Gradle's own lifecycle
// plugin to the root, and that plugin declares `clean` itself -- two tasks of
// one name, and the build stops before it configures anything.
tasks.register('cleanRootBuild', Delete) {
    delete rootProject.layout.buildDirectory
}
