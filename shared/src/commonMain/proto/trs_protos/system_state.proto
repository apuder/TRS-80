syntax = "proto3";

// The TRS-Xray state dump.
//
// The only copy: this used to be duplicated in app/src/main/proto, because the
// old Android UI generated protobuf-lite classes from it and Wire would have
// put a second NativeSystemState on the same classpath. Nothing generates from
// that file any more, so it is gone and this is the schema.
//
// It is also what app/src/main/c/trs_xray_state_save.cpp writes by hand -- the
// C side encodes the message itself rather than linking a protobuf runtime, so
// a field number changed here has to be changed there too.
option java_package = "org.puder.trs80.shared.xray";
option java_multiple_files = true;

package trs_protos;

// The state of a TRS system, including registers and memory.
message NativeSystemState {
  message Registers {
    int32 ix = 1;
    int32 iy = 2;
    int32 pc = 3;
    int32 sp = 4;
    int32 af = 5;
    int32 bc = 6;
    int32 de = 7;
    int32 hl = 8;
    int32 af_prime = 9;
    int32 bc_prime = 10;
    int32 de_prime = 11;
    int32 hl_prime = 12;
    int32 i = 13;
    int32 r_1 = 14;
    int32 r_2 = 15;
  }

  // Single memory region.
  message MemoryRegion {
    int32 start = 1;
    bytes data = 2;
  }

  Registers registers = 2;
  repeated MemoryRegion memoryRegions = 3;
}
