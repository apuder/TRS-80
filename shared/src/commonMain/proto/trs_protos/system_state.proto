syntax = "proto3";

// The TRS-Xray state dump, for the shared module.
//
// A second copy of app/src/main/proto/system_state.proto, and deliberately so.
// The wire format is what matters and both files describe the same one; what
// differs is who generates from them. Android's copy is compiled by the
// protobuf-lite plugin into org.puder.trs80.proto, and that package is baked
// into the shipping app. Pointing Wire at the same file would put a second
// NativeSystemState in the same package on Android's classpath, and moving
// Android onto the Wire type means unpicking the protobuf plugin from the app
// that is currently in the store.
//
// So: same schema, different generated package. If the dump format ever
// changes, both files change together.
option java_package = "org.puder.trs80.shared.xray";
option java_multiple_files = true;

package trs_protos_shared;

// The state of a TRS system, including registers and memory.
message NativeSystemState {
  message Registers {
    int32 ix = 1;
    int32 iy = 2;
    int32 pc = 3;
    int32 sp = 4;
    int32 af = 5;
    int32 bc = 6;
    int32 de = 7;
    int32 hl = 8;
    int32 af_prime = 9;
    int32 bc_prime = 10;
    int32 de_prime = 11;
    int32 hl_prime = 12;
    int32 i = 13;
    int32 r_1 = 14;
    int32 r_2 = 15;
  }

  // Single memory region.
  message MemoryRegion {
    int32 start = 1;
    bytes data = 2;
  }

  Registers registers = 2;
  repeated MemoryRegion memoryRegions = 3;
}
