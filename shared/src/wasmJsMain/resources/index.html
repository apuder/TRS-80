<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TRS-80</title>
    <!-- The SVG scales to every size; the PNGs are for what will not take it. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-96.png" sizes="96x96" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        /* The canvas is the app; the page around it is only its ground. */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1917; }
        /*
         * dvh, not vh, and it matters on a phone.
         *
         * A phone browser's vh is the height the page would have if the
         * address bar and the toolbar were out of the way -- it does not
         * change when they come and go, deliberately, so that a page does not
         * reflow as you scroll. The app is not a page that scrolls: it is one
         * screenful, laid out to the height it is given, and given a height
         * taller than what can be seen it puts the bottom of itself behind the
         * toolbar. The space bar is the bottom of itself, and body is
         * overflow: hidden, so there was no scrolling down to it either.
         *
         * dvh is that same height as it actually is at the moment, toolbars
         * counted. vh stays as the fallback for anything too old to know it.
         */
        #trs80 { width: 100vw; height: 100vh; height: 100dvh; }
        canvas { display: block; outline: none; }
    </style>
</head>
<body>
    <div id="trs80"></div>
    <!--
        The emulator, fetched by the page rather than by the app.

        A classic script, so it runs here in document order and the promise
        exists before the app below starts looking for it. It is imported here
        because the app is bundled: webpack resolves every import it can read,
        and Emscripten's module is not its to resolve -- it is already complete
        and it lives beside this file.
    -->
    <script>
        window.trs80Core = import('./trs80core.js').then(function (module) {
            return module.default();
        });
    </script>
    <script src="trs80.js"></script>
</body>
</html>
