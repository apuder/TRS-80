// The shared Kotlin Multiplatform module: the domain layer that both the
// Android app and (eventually) an iOS app build against.
//
// Note this uses com.android.kotlin.multiplatform.library rather than
// com.android.library. Since AGP 9.0 the ordinary Android library plugin is
// incompatible with the Kotlin Multiplatform plugin in the same module.
buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.squareup.wire:wire-gradle-plugin:6.4.5'
    }
}

plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Generates the RetroStore API messages from src/commonMain/proto. Applied the
// classpath way rather than through the plugins block so it resolves from Maven
// Central instead of the Gradle plugin portal.
apply plugin: 'com.squareup.wire'

wire {
    sourcePath {
        srcDir 'src/commonMain/proto'
    }
    // Kotlin data holders plus their ProtoAdapters, in commonMain so both
    // platforms get them. The package comes from the proto's java_package.
    kotlin {}
}

repositories {
    google()
    mavenCentral()
}

// ---------------------------------------------------------------------------
// The emulator core, built for iOS.
//
// On Android the core is compiled by AGP's externalNativeBuild. iOS has no
// equivalent, so CMake is driven directly, once per target, into a directory
// derived from the target name so that cinterop can be pointed at it without
// resolving task outputs during configuration.
// ---------------------------------------------------------------------------

def nativeSrcDir = rootProject.file('app/src/main/c')
def iosMinVersion = '15.0'

// Kotlin target name -> the Xcode SDK and architecture it needs.
def iosTargets = [
        iosArm64         : [sdk: 'iphoneos', arch: 'arm64'],
        iosSimulatorArm64: [sdk: 'iphonesimulator', arch: 'arm64'],
]

// Where a given target's static library lands. A plain path, so both the
// producing task and the cinterop configuration can name it eagerly.
def coreLibDir = { String targetName ->
    layout.buildDirectory.dir("ios-core/$targetName").get().asFile
}

// Declared as a closure rather than a method: a method could not see the
// script-level definitions above, which is a Groovy scoping rule rather than
// anything to do with Gradle.
def registerCoreBuild = { String targetName, String sdk, String arch ->
    def outputDir = coreLibDir(targetName)
    return tasks.register("buildIosCore${targetName.capitalize()}") {
        description = "Builds the TRS-80 emulator core for $sdk/$arch."
        inputs.dir(nativeSrcDir).withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.file(new File(outputDir, 'libtrs80core.a'))
        outputs.cacheIf { true }
        doLast {
            outputDir.mkdirs()
            def runCmake = { List<String> args ->
                providers.exec { commandLine(['cmake'] + args) }
                        .result.get().assertNormalExitValue()
            }
            runCmake([
                    '-S', nativeSrcDir.absolutePath,
                    '-B', outputDir.absolutePath,
                    '-G', 'Unix Makefiles',
                    '-DCMAKE_SYSTEM_NAME=iOS',
                    "-DCMAKE_OSX_ARCHITECTURES=$arch".toString(),
                    "-DCMAKE_OSX_SYSROOT=$sdk".toString(),
                    "-DCMAKE_OSX_DEPLOYMENT_TARGET=$iosMinVersion".toString(),
                    '-DCMAKE_BUILD_TYPE=Release',
            ])
            runCmake(['--build', outputDir.absolutePath, '--parallel'])
        }
    }
}

def coreBuilds = iosTargets.collectEntries { name, spec ->
    [(name): registerCoreBuild(name, spec.sdk, spec.arch)]
}

// ---------------------------------------------------------------------------
// The emulator core, built for the browser.
//
// The same CMakeLists, through Emscripten, which links rather than archives:
// what comes out is a JavaScript module wrapping WebAssembly, and it is put
// beside the app's own so a page can import it. Needs emcc on the PATH; without
// it the task says so rather than failing halfway through a build.
// ---------------------------------------------------------------------------

def webCoreDir = layout.buildDirectory.dir('web-core')

// Emscripten is not a build dependency so much as one more toolchain someone
// may or may not have, like Xcode. CI has neither it nor a browser to run the
// result in, so the task skips rather than failing the build: what it produces
// is only needed by whoever is actually opening the page.
def emccPath = providers.provider {
    ['/opt/homebrew/bin/emcc', '/usr/local/bin/emcc'].find { new File(it).exists() }
}

def buildWebCore = tasks.register('buildWebCore') {
    description = 'Builds the TRS-80 emulator core as WebAssembly.'
    onlyIf {
        def found = emccPath.getOrNull() != null
        if (!found) {
            logger.lifecycle('Skipping the WebAssembly core: emcc is not installed.')
        }
        found
    }
    inputs.dir(nativeSrcDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(webCoreDir)
    outputs.cacheIf { true }
    doLast {
        def outputDir = webCoreDir.get().asFile
        outputDir.mkdirs()
        def emcmake = new File(emccPath.get()).parentFile.toPath().resolve('emcmake').toString()
        def run = { List<String> command ->
            providers.exec { commandLine(command) }.result.get().assertNormalExitValue()
        }
        run([emcmake, 'cmake',
             '-S', nativeSrcDir.absolutePath,
             '-B', outputDir.absolutePath,
             '-DCMAKE_BUILD_TYPE=Release'])
        run(['cmake', '--build', outputDir.absolutePath, '--parallel'])
    }
}

// The module lands in the distribution beside index.html, and deliberately not
// in the source set's resources: those go through webpack, which bundles what
// it finds -- and Emscripten's JavaScript imports node:module for the
// environments it also supports, which webpack cannot resolve for a browser and
// stops on. It is already a complete module and wants no processing at all.
def copyWebCore = tasks.register('copyWebCore', Copy) {
    dependsOn(buildWebCore)
    // Nothing to copy when the core was not built; the app still runs, with the
    // machine missing, which is what it did before there was a core at all.
    onlyIf { webCoreDir.get().asFile.exists() }
    from(webCoreDir) {
        include 'trs80core.js'
        include 'trs80core.wasm'
    }
    // The audio worklet goes the same way and for the same reason: it is loaded
    // by URL at run time, by the browser's own audio thread, and webpack has
    // nothing to do with it.
    from('src/wasmJsMain/web')
    into(layout.buildDirectory.dir('dist/wasmJs/productionExecutable'))
}

/*
 * The Compose resources -- strings, fonts -- as Android assets.
 *
 * The plugin makes the task but never gives it an output directory: it hooks
 * that up through AGP's variant API, which it only does for the ordinary
 * com.android.library plugin, and this module has to use
 * com.android.kotlin.multiplatform.library instead (see the note at the top).
 * So the destination is set here, and the app module adds it to its own assets;
 * without that the app starts and dies on the first string it asks for.
 *
 * Worth removing the moment Compose Multiplatform knows about AGP's KMP library
 * plugin, which is the same day this stops being needed at both ends.
 */
/*
 * The version, as a constant the shared code can read.
 *
 * Generated rather than written down here, so that gradle.properties stays the
 * only place it is set: Android's manifest takes it from there and so does
 * this, and the two cannot drift.
 */
def generateBuildVersion = tasks.register('generateBuildVersion') {
    def outputDir = layout.buildDirectory.dir('generated/version')
    def name = providers.gradleProperty('trs80VersionName')
    def code = providers.gradleProperty('trs80VersionCode')
    inputs.property('versionName', name)
    inputs.property('versionCode', code)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('org/puder/trs80/shared/BuildVersion.kt').asFile
        file.parentFile.mkdirs()
        file.text = """// Generated from gradle.properties. Do not edit.
package org.puder.trs80.shared

internal const val VERSION_NAME = "${name.get()}"
internal const val VERSION_CODE = ${code.get()}
"""
    }
}

// matching, not named: the plugin registers this task later than this file is
// read, so asking for it by name here fails outright.
// The emulator module is put into the distribution once the app's own is built.
tasks.matching { it.name == 'wasmJsBrowserDistribution' }.configureEach {
    finalizedBy(copyWebCore)
}

tasks.matching { it.name == 'copyAndroidMainComposeResourcesToAndroidAssets' }.configureEach {
    outputDirectory = layout.buildDirectory.dir('androidComposeResources')
}

// Gradle reports only "BUILD SUCCESSFUL" for test tasks by default, which is
// indistinguishable from a run that found no tests at all. Name them.
tasks.withType(AbstractTestTask).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

kotlin {
    androidLibrary {
        namespace = 'org.puder.trs80.shared'
        compileSdk = 37
        minSdk = 26
    }

    // Named so the produced framework is importable from Swift as `Shared`.
    // No iosX64: Compose Multiplatform stopped publishing the Intel simulator
    // target in 1.11, along with the other x64 Apple ones. Nothing here needs it
    // -- the simulator on an Apple Silicon Mac is iosSimulatorArm64, which is
    // what the tests have always actually run on.
    iosArm64 { binaries.framework { baseName = 'Shared' } }
    iosSimulatorArm64 { binaries.framework { baseName = 'Shared' } }

    // The browser. Compose draws to a canvas here exactly as it does on iOS,
    // through the same Skia; what a browser cannot do is run the emulator, which
    // is C and gets in only through Emscripten. So this target starts with the
    // screens and a machine that does nothing -- see WasmApp.kt -- and the core
    // is the next question, not this one.
    wasmJs {
        browser {
            commonWebpackConfig {
                outputFileName = 'trs80.js'
            }
        }
        binaries.executable()
    }

    targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach { target ->
        def coreBuild = coreBuilds[target.name]
        if (coreBuild == null) {
            return
        }
        def libDir = coreLibDir(target.name).absolutePath

        target.compilations.named('main') {
            cinterops.register('trs80core') {
                definitionFile = file('src/nativeInterop/cinterop/trs80core.def')
                // The header comes from the native tree; the archive named by
                // the .def is found under this target's build directory.
                includeDirs.allHeaders(nativeSrcDir)
                extraOpts('-libraryPath', libDir)
            }
        }

        // cinterop resolves the .def's staticLibraries when it runs, so the
        // archive has to have been built already.
        tasks.named("cinteropTrs80core${target.name.capitalize()}") {
            dependsOn(coreBuild)
        }

        // The core's audio sink is AudioQueue on iOS. The archive records the
        // dependency but cannot satisfy it; the final binary has to link it.
        target.binaries.all {
            linkerOpts('-framework', 'AudioToolbox')
        }
    }

    sourceSets {
        commonMain {
            kotlin.srcDir(generateBuildVersion)
            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
                // The key-value store. Its Android implementation is
                // SharedPreferences and its iOS one NSUserDefaults, so the
                // existing Android data stays readable and no format changes.
                // api, not implementation: the storage classes expose Settings
                // in their constructors so the host can supply the platform's.
                api 'com.russhwolf:multiplatform-settings:1.3.0'

                // Files. api, not implementation: FileManager hands out okio
                // Paths and takes a FileSystem, so callers need the types.
                api 'com.squareup.okio:okio:3.18.1'

                // The RetroStore messages. api, not implementation: they are part
                // of this module's surface, so their Message supertype has to be
                // on a consumer's compile classpath too.
                api 'com.squareup.wire:wire-runtime:6.4.5'


                // Compose Multiplatform: the emulator surface is drawn from
                // commonMain so both hosts share it.
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.ui
                implementation compose.material3
                // Fonts for the design system; see ui/theme.
                implementation compose.components.resources

                // The system's back, in common code: Android's button and
                // gesture, and iOS's swipe from the left edge. Named outright
                // because the compose extension has no accessor for it, and it
                // arrives transitively on iOS but not on Android -- which shows
                // up as commonMain compiling for one platform and not the
                // other. The version follows the plugin's rather than being
                // typed again here.
                implementation "org.jetbrains.compose.ui:ui-backhandler:" +
                        org.jetbrains.compose.ComposeBuildConfig.composeVersion

                // Navigation 3. The back stack is ours (see the navigation
                // package); this renders it and puts it away for us.
                implementation 'org.jetbrains.androidx.navigation3:navigation3-ui:1.1.1'
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0'
            }
        }
        wasmJsMain {
            dependencies {
                // An in-memory file system stands in for the one a browser does
                // not have; see io/AppDirectory.wasmJs.kt.
                implementation 'com.squareup.okio:okio-fakefilesystem:3.18.1'
                // Typed arrays, for getting a frame out of the emulator's heap
                // in one copy rather than a hundred thousand.
                implementation 'org.jetbrains.kotlinx:kotlinx-browser:0.5.0'
            }
        }

        commonTest {
            dependencies {
                implementation kotlin('test')
                // trs80_run() blocks, so the iOS tests need a second thread to
                // drive the CPU while the test polls.
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
                // MapSettings, the in-memory store. Lets the migration be
                // tested without a device or a real preferences file.
                implementation 'com.russhwolf:multiplatform-settings-test:1.3.0'
                // FakeFileSystem, so the file code is testable without a disk.
                implementation 'com.squareup.okio:okio-fakefilesystem:3.18.1'
                // runTest, for the suspending downloader.
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
            }
        }
    }
}
