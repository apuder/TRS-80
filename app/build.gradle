buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
    }
}

plugins {
    id 'com.android.application'
    id 'com.google.protobuf' version '0.10.0'
}

// Pins the JDK that compiles, independently of the JDK that launches Gradle,
// so local and CI builds agree.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    repositories {
        google()
        mavenCentral()
    }

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.google.protobuf:protobuf-lite:3.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.android.gms:play-services-cast:21.5.0'
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation project(':retrostore')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.21.1"
    }
    plugins {
        javalite {
            // On Macs pin the Intel binary: protoc-gen-javalite was never
            // published for Apple Silicon, but the Intel one runs via Rosetta.
            def isMac = System.getProperty('os.name').toLowerCase().contains('mac')
            artifact = 'com.google.protobuf:protoc-gen-javalite:3.0.0' +
                    (isMac ? ':osx-x86_64' : '')
        }
    }

    // Java only. The native side no longer needs generated protobuf code:
    // trs_xray_state_save.cpp encodes the one message it writes by hand.
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
            }
            task.plugins {
                javalite { }
            }
        }
    }
}

android {
    compileSdk 37
    compileSdkMinor 1
    // NDK r28+ produces 16 KB page-size-aligned native libs, required by
    // Google Play for apps targeting Android 15+.
    ndkVersion '28.2.13676358'
    // Without this the build defaults to source/target 8, which JDK 21 has
    // deprecated and will eventually refuse to compile.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "org.puder.trs80"
        minSdk 26
        targetSdk 36
        versionCode 49
        versionName "0.99"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11", "-frtti", "-fexceptions"
            }
        }
    }
    signingConfigs {
        release {
            // Credentials come from ~/.gradle/gradle.properties so they stay
            // out of the repository. Where they are absent (CI), the release
            // build is left unsigned instead of failing.
            if (project.hasProperty('TRS80_KEYSTORE')) {
                storeFile file(project.property('TRS80_KEYSTORE'))
                storePassword project.property('TRS80_KEYSTORE_PASSWORD')
                keyAlias project.property('TRS80_KEY_ALIAS')
                keyPassword project.property('TRS80_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            if (project.hasProperty('TRS80_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version '3.22.1'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    namespace 'org.puder.trs80'
    lint {
        // No baseline: the project currently has no lint errors, only warnings.
        // The old baseline referenced the pre-Kotlin .java paths and was stale.
        abortOnError = true
    }
}
