import javax.inject.Inject

plugins {
    id 'com.android.application'
}



// Pins the JDK that compiles, independently of the JDK that launches Gradle,
// so local and CI builds agree.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    repositories {
        google()
        mavenCentral()
    }

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    /*
     * Crash reporting, and analytics.
     *
     * The ndk artifact is the one that matters here: the emulator is C, and the
     * crashes worth seeing are signals raised inside it rather than Java
     * exceptions -- the disk bug that took the process out was getc(NULL) three
     * frames below the CPU loop.
     *
     * Analytics needs no code of its own -- it starts itself from the same
     * resources -- and it is what tells Crashlytics which users are crashing
     * rather than only how often, so the two are worth having together.
     *
     * Configured by string resources in src/main/res/values/firebase.xml, which
     * is not in the repository. Without them Firebase initialises to nothing and
     * this reports nowhere, which is what a fork, a contributor and CI need.
     * There is no google-services plugin: as of 4.5.0 it still reads
     * `applicationVariants`, which AGP 9 removed, so applying it fails the build
     * outright. All it does is write those same resources.
     *
     * See docs/CRASH-REPORTING.md, including how native symbols get uploaded
     * while that plugin is unusable.
     */
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation project(':shared')

}


/*
 * The shared module's Compose resources -- its strings and its fonts.
 *
 * They should arrive inside the .aar and do not. Compose Multiplatform hooks
 * its asset-copying task up through AGP's variant API, which only the ordinary
 * library plugin supports; :shared has to use AGP's Kotlin Multiplatform
 * library plugin, whose variants have no assets source to hook into at all. So
 * the resources are fetched from where that task leaves them and packaged from
 * here. Without this the app launches and dies on the first string it asks for,
 * which is on the first screen.
 *
 * Worth deleting the day Compose Multiplatform knows about that plugin.
 */
def sharedComposeResources = tasks.register('copySharedComposeResources', GatherAssets) {
    dependsOn ':shared:copyAndroidMainComposeResourcesToAndroidAssets'
    source.from("${rootProject.projectDir}/shared/build/androidComposeResources")
    outputDirectory = layout.buildDirectory.dir('generated/sharedComposeResources')
}

/*
 * The Crashlytics build ID.
 *
 * The Crashlytics Gradle plugin generates a string resource under exactly this
 * name, and that plugin cannot be applied here: it refuses to configure without
 * google-services, which AGP 9 broke. See docs/CRASH-REPORTING.md.
 *
 * Without the resource the SDK does not degrade quietly. FirebaseCrashlytics
 * throws out of its initialiser, that runs inside FirebaseInitProvider, and the
 * app dies before its first frame -- so the moment Firebase is configured at
 * all, which is what firebase.xml does, the app stops launching. It cost an
 * afternoon to find because the two halves are far apart: adding the file turns
 * on a component that has been missing a resource since long before.
 *
 * Derived from the version rather than random, so that two builds of one
 * release agree with each other and an incremental build does not churn it.
 */
abstract class GenerateCrashlyticsBuildId extends DefaultTask {
    @Input abstract Property<String> getVersionName()
    @Input abstract Property<String> getVersionCode()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def values = new File(outputDirectory.get().asFile, 'values')
        values.mkdirs()
        def seed = "org.puder.trs80 ${versionName.get()} ${versionCode.get()}"
        def id = UUID.nameUUIDFromBytes(seed.getBytes('UTF-8')).toString()
        new File(values, 'com_crashlytics_build_id.xml').text =
                """<?xml version="1.0" encoding="utf-8"?>
<!-- Generated by :app:generateCrashlyticsBuildId. Do not edit. -->
<resources>
    <string name="com.crashlytics.android.build_id" translatable="false">${id}</string>
</resources>
"""
    }
}

def crashlyticsBuildId = tasks.register(
        'generateCrashlyticsBuildId', GenerateCrashlyticsBuildId) {
    versionName.set(trs80VersionName)
    versionCode.set(trs80VersionCode)
    outputDirectory.set(layout.buildDirectory.dir('generated/crashlyticsBuildId'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // The variant API rather than sourceSets: AGP 9 refuses generated
        // directories there, and this is what tells it the assets are made by a
        // task rather than checked in.
        variant.sources.assets.addGeneratedSourceDirectory(
                sharedComposeResources, { it.outputDirectory })
        variant.sources.res.addGeneratedSourceDirectory(
                crashlyticsBuildId, { it.outputDirectory })
    }
}

android {
    compileSdk 37
    compileSdkMinor 1
    // NDK r28+ produces 16 KB page-size-aligned native libs, required by
    // Google Play for apps targeting Android 15+.
    ndkVersion '28.2.13676358'
    // Without this the build defaults to source/target 8, which JDK 21 has
    // deprecated and will eventually refuse to compile.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "org.puder.trs80"
        minSdk 26
        targetSdk 36
        // See gradle.properties; the shared code is told the same two values.
        versionCode trs80VersionCode.toInteger()
        versionName trs80VersionName
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11", "-frtti", "-fexceptions"
            }
        }
    }
    signingConfigs {
        release {
            // Credentials come from ~/.gradle/gradle.properties so they stay
            // out of the repository. Where they are absent (CI), the release
            // build is left unsigned instead of failing.
            if (project.hasProperty('TRS80_KEYSTORE')) {
                storeFile file(project.property('TRS80_KEYSTORE'))
                storePassword project.property('TRS80_KEYSTORE_PASSWORD')
                keyAlias project.property('TRS80_KEY_ALIAS')
                keyPassword project.property('TRS80_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            if (project.hasProperty('TRS80_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version '3.22.1'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    namespace 'org.puder.trs80'
    lint {
        // No baseline: the project currently has no lint errors, only warnings.
        // The old baseline referenced the pre-Kotlin .java paths and was stale.
        abortOnError = true
    }
}

/**
 * Gathers files a task in another project produced, as this project's own
 * generated assets.
 *
 * A plain Copy would do the copying, but AGP's variant API wires to a
 * DirectoryProperty and Copy has none -- so this is a Copy with the one
 * property it wants.
 */
abstract class GatherAssets extends DefaultTask {

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSource()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileOperations()

    @TaskAction
    void gather() {
        fileOperations.sync {
            it.from(source)
            it.into(outputDirectory)
        }
    }
}
